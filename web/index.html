<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vokabeln lernen – offline auf dem Gerät.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vokabeln">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vokabel App</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      position: fixed;
      inset: 0;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    flt-glass-pane,
    flutter-view,
    flt-scene-host,
    #flutter-view {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      touch-action: manipulation;
    }
  </style>

  <script>
    (function () {
      function syncViewport() {
        window.dispatchEvent(new Event('resize'));
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', syncViewport);
        window.visualViewport.addEventListener('scroll', syncViewport);
      }

      window.addEventListener('orientationchange', function () {
        setTimeout(syncViewport, 100);
      });

      window.addEventListener('pageshow', function () {
        [0, 50, 150, 300, 500, 800].forEach(function (ms) {
          setTimeout(syncViewport, ms);
        });
      });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
